<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing Canvas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        header {
            background-color: #333;
            color: white;
            width: 100%;
            padding: 1rem 0;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        h1 {
            margin: 0;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            width: 90%;
            max-width: 1000px;
        }
        
        .tools {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
            width: 100%;
            background-color: white;
            padding: 1rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .tool-btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .tool-btn:hover {
            background-color: #45a049;
        }
        
        .color-picker {
            width: 40px;
            height: 40px;
            border: none;
            cursor: pointer;
            background: none;
            padding: 0;
        }
        
        .brush-size {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .canvas-container {
            width: 100%;
            height: 500px;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        #drawing-canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }
        
        .footer {
            margin-top: 2rem;
            color: #666;
            text-align: center;
        }
        
        @media (max-width: 600px) {
            .tools {
                flex-direction: column;
                align-items: center;
            }
            
            .canvas-container {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Drawing Canvas</h1>
    </header>
    
    <div class="container">
        <div class="tools">
            <button class="tool-btn" id="clear-btn">Clear Canvas</button>
            <input type="color" class="color-picker" id="color-picker" value="#000000">
            <div class="brush-size">
                <label for="brush-size">Size:</label>
                <input type="range" id="brush-size" min="1" max="50" value="5">
                <span id="brush-size-value">5</span>
            </div>
            <button class="tool-btn" id="eraser-btn">Eraser</button>
            <button class="tool-btn" id="save-btn">Save Drawing</button>
        </div>
        
        <div class="canvas-container">
            <canvas id="drawing-canvas"></canvas>
        </div>
    </div>
    
    <div class="footer">
        <p>Draw anything you like on this canvas!</p>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const canvas = document.getElementById('drawing-canvas');
            const ctx = canvas.getContext('2d');
            const colorPicker = document.getElementById('color-picker');
            const brushSize = document.getElementById('brush-size');
            const brushSizeValue = document.getElementById('brush-size-value');
            const clearBtn = document.getElementById('clear-btn');
            const eraserBtn = document.getElementById('eraser-btn');
            const saveBtn = document.getElementById('save-btn');
            
            // Set canvas size to match container
            function resizeCanvas() {
                const container = canvas.parentElement;
                canvas.width = container.offsetWidth;
                canvas.height = container.offsetHeight;
                
                // Redraw canvas content after resize (if needed)
                // You might want to implement a way to save/restore drawings on resize
            }
            
            // Initial resize
            resizeCanvas();
            
            // Handle window resize
            window.addEventListener('resize', resizeCanvas);
            
            // Drawing state
            let isDrawing = false;
            let currentColor = colorPicker.value;
            let currentSize = brushSize.value;
            
            // Update brush size display
            brushSizeValue.textContent = currentSize;
            
            // Event listeners for tools
            colorPicker.addEventListener('input', function() {
                currentColor = this.value;
            });
            
            brushSize.addEventListener('input', function() {
                currentSize = this.value;
                brushSizeValue.textContent = currentSize;
            });
            
            clearBtn.addEventListener('click', function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            });
            
            eraserBtn.addEventListener('click', function() {
                currentColor = '#ffffff'; // Using white as eraser
            });
            
            saveBtn.addEventListener('click', function() {
                const link = document.createElement('a');
                link.download = 'drawing.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
            
            // Drawing functions
            function startDrawing(e) {
                isDrawing = true;
                draw(e);
            }
            
            function stopDrawing() {
                isDrawing = false;
                ctx.beginPath(); // Start new path for next drawing
            }
            
            function draw(e) {
                if (!isDrawing) return;
                
                ctx.lineWidth = currentSize;
                ctx.lineCap = 'round';
                ctx.strokeStyle = currentColor;
                
                // Get position (handling both mouse and touch events)
                let x, y;
                if (e.type.includes('touch')) {
                    const rect = canvas.getBoundingClientRect();
                    x = e.touches[0].clientX - rect.left;
                    y = e.touches[0].clientY - rect.top;
                } else {
                    x = e.offsetX;
                    y = e.offsetY;
                }
                
                ctx.lineTo(x, y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, y);
            }
            
            // Mouse events
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);
            
            // Touch events for mobile devices
            canvas.addEventListener('touchstart', function(e) {
                e.preventDefault();
                startDrawing(e);
            });
            
            canvas.addEventListener('touchmove', function(e) {
                e.preventDefault();
                draw(e);
            });
            
            canvas.addEventListener('touchend', function(e) {
                e.preventDefault();
                stopDrawing();
            });
            
            // Initialize canvas with white background
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        });
    </script>
</body>
</html>
